# docker compose -f deploy/compose.yaml up -d --build
# Persistent data lives on the host under /srv/bal (media prepared offline, SQLite).
services:
  bal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: /srv/bal/bal.env
    volumes:
      - /srv/bal/media:/data/media:ro
      - /srv/bal/db:/data/db
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs: [/tmp]
