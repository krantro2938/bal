# Alternative to Caddy: /etc/nginx/sites-available/bal (certificate via certbot --nginx).
server {
    listen 80;
    server_name bal.example.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bal.example.ru;
    # ssl_certificate / ssl_certificate_key are added by certbot

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Range requests must reach the Go server untouched.
    location /media/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        gzip off;
    }
}
